name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    name: host-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Install pinned Arm GNU Toolchain
        env:
          ARM_ARCHIVE: arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi.tar.xz
          ARM_SHA256: 597893282ac8c6ab1a4073977f2362990184599643b4c5ee34870a8215783a16
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$ARM_ARCHIVE" \
            "https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/$ARM_ARCHIVE"
          echo "$ARM_SHA256  $RUNNER_TEMP/$ARM_ARCHIVE" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/$ARM_ARCHIVE" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${ARM_ARCHIVE%.tar.xz}/bin" >> "$GITHUB_PATH"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Create venv and install deps
        run: |
          make setup
          .venv/bin/pip install ruff==0.17.2

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Build firmware
        run: |
          make toolchain-info
          make firmware
          make firmware-hash

      - name: Unit tests
        run: .venv/bin/python -m unittest discover -v

      - name: Golden DTRC through RTL FIFO
        run: |
          command -v iverilog
          command -v vvp
          .venv/bin/python -m unittest tests.test_end_to_end -v

      - name: Race-first demo
        run: make demo

      - name: Model demo stream size
        run: .venv/bin/python -m replay.demo

  rtl:
    name: rtl-verilator
    runs-on: ubuntu-24.04
    # Host job is the badge contract; RTL is best-effort on Ubuntu packages.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install RTL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator yosys

      - name: Same-clock FIFO test
        run: make rtl-test

      - name: Capture-gate test
        run: make gateway-test

      - name: Static RTL checks
        run: make rtl-lint
