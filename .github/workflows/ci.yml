name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    name: host-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create venv and install deps
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Build firmware
        run: make firmware

      - name: Unit tests
        run: .venv/bin/python -m unittest discover -v

      - name: Race-first demo
        run: make demo

      - name: Model demo stream size
        run: .venv/bin/python -m replay.demo

  rtl:
    name: rtl-verilator
    runs-on: ubuntu-latest
    # Host job is the badge contract; RTL is best-effort on Ubuntu packages.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Same-clock FIFO test
        run: make rtl-test

      - name: Capture-gate test
        run: make gateway-test
